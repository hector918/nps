name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# This replaces the 2021 pipeline, which built thirty-three targets plus an
# Android APK, a Synology package and DockerHub images. Its jobs were pinned to
# action versions current runners no longer execute, and the image jobs need
# DockerHub secrets this fork does not have. What remains is what the fleet
# actually consumes: Linux client and server binaries, and the checksum file
# that makes a curl-driven update verifiable. The old pipeline is in git
# history if a platform is ever needed back.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Taken from the go directive so the toolchain cannot drift away
          # from what the dependencies require.
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet ./lib/selfupdate/...
          cd nps-mux && go test ./...

      - name: Build
        run: |
          chmod +x build.release.sh
          ./build.release.sh "${GITHUB_REF_NAME}"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
